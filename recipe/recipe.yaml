schema_version: 1

context:
  version: "3.10.1"

package:
  name: prettier
  version: ${{ version|replace("-", "_") }}

source:
  url: https://github.com/prettier/prettier/archive/refs/tags/${{ version }}.tar.gz
  sha256: e4b1e352073305b661e3d24e67bf575dc2a8114578e8600d2f8355ed2ee85370

build:
  number: 0

requirements:
  build:
    - ${{ stdlib("c") }}
    - if: not win
      then: nodejs
    - pnpm
    - pnpm-licenses >=2.1.0
  host:
    - nodejs
  run:
    - nodejs

tests:
  - script:
      - if: not win
        then: prettier --version | grep "${{ version }}"
        else:
          - prettier --version | findstr "${{ version }}"
          - where prettier
about:
  license: MIT
  license_file:
    - LICENSE
    - ThirdPartyLicenses.txt
  summary: Prettier is an opinionated code formatter.
  homepage: https://github.com/prettier/prettier

extra:
  recipe-maintainers:
    - janjagusch
    - xhochy
    - pavelzw
